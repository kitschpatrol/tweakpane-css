name: Update Dependencies

on:
  workflow_dispatch: {}
  schedule:
    - cron: '0 3 * * 1'

permissions:
  contents: read

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm ci

      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium

      - name: Run ksc-update
        uses: kitschpatrol/github-action-skill-to-pr@fe3e8b4aea5851133d8b064a68e92f7b7e4de1e4 # v1.1.1
        with:
          skill: ksc-update
          claude-code-oauth-token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github-token: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
          model: claude-opus-5-5
          effort: high
          max-turns: 400
          instructions: |
            Project shape
            - The only published artifact is dist/main.js: a minified single-file IIFE that bundles Svelte, svelte-tweakpane-ui, Tweakpane 4 and its plugins, svelte-persisted-store, element-ready, qs, and color-parse. Every dependency is a devDependency, but anything that ends up in the bundle is consumer-facing runtime code. Review bundled packages, including transitives such as fast-copy, fast-equals, and nanoid, as production dependencies.
            - Consumers are browsers loading the script from a CDN, node_modules, or a bookmarklet. There is no Node.js runtime consumer, so leave engines.node alone.
            - Skip the known-consumers step and do not create or edit a "Known consumers" section in CLAUDE.md or AGENTS.md. The Playwright suite is the consumer validation; do not report missing consumers as a gap.

            Tweakpane compatibility
            - svelte-tweakpane-ui (an authored package) pins exact versions of tweakpane, @tweakpane/core, tweakpane-plugin-color-plus, and the @kitschpatrol/tweakpane-plugin-* prereleases. Those prereleases are intentional upstream pins, not a new prerelease channel. Never add tweakpane, @tweakpane/core, or any Tweakpane plugin as a direct dependency, override, or peer rule; svelte-tweakpane-ui governs them.
            - After every resolution, confirm pnpm-lock.yaml contains exactly one tweakpane version and one @tweakpane/core version (`pnpm why tweakpane @tweakpane/core`). Tweakpane throws notCompatible at runtime for plugins whose core major differs, and duplicate copies break instanceof checks and style injection.
            - A Tweakpane major (v5, @tweakpane/core 3) only arrives through a svelte-tweakpane-ui release. Do not try to force it.
            - Tweakpane injects its CSS into document.head once per data-tp-style id and skips ids that already exist. When the bundled Tweakpane version changes, its styles can collide with a host page that loads its own Tweakpane. Call out Tweakpane version changes as consumer-visible in the report.
            - The direct svelte-persisted-store range must resolve to the same version svelte-tweakpane-ui pins, so only one copy is bundled. If they diverge, align the direct range with svelte-tweakpane-ui's exact pin.
            - Users' saved tweaks live in localStorage under the keys css, css-options, and css-expanded-state, and in the Pane's localStoreId "tweakpane-css". An update that changes storage keys or serialization (svelte-persisted-store, svelte-tweakpane-ui) is a breaking change.
            - src/components/TweakpaneCss.svelte uses legacy Svelte 4 syntax (export let, on:click, store bindings) under Svelte 5. svelte-tweakpane-ui ships uncompiled .svelte files that this project's Svelte compiles. Review Svelte release notes for legacy-mode, store, and bind: changes.
            - TweakpaneCss.svelte wraps the Pane in a `style:all="initial" style:display="contents"` div with a TODO to remove it once svelte-tweakpane-ui ships pointer-events: auto on draggable panes (after 1.6.0). When svelte-tweakpane-ui updates, check its release notes and report whether the wrapper can go. Do not remove it in the update itself: removal also drops the reset of other inherited styles, which is a separate behavior decision. tests/host-styles.test.ts must keep passing.

            Build output
            - dist/main.js must stay a single classic (non-module) IIFE with no code splitting and no extracted CSS. It reads document.currentScript and calls preload() synchronously to prevent FOUC, so any Vite or rolldown change that alters the output format, chunking, or wrapper is breaking.
            - To diff the bundle, format both builds with `pnpm exec prettier --no-config --parser babel` and normalize minified identifiers before comparing. Svelte scoped class hashes (svelte-xxxxxx) change whenever svelte-tweakpane-ui's .pnpm directory name changes, for example through its peer suffix (@typescript-eslint/types). That is expected and not a regression.
            - vite.config.ts sets no build.target, so Vite's default ESBUILD_BASELINE_WIDELY_AVAILABLE_TARGET (chrome111, edge111, firefox114, safari16.4, ios16.4 as of Vite 8.3) defines consumer browser support. When Vite updates, compare that array in node_modules/vite/dist and report any change as a consumer browser-support change.
            - The eslint.config.ts override `require-unicode-regexp: requireFlag 'u'` protects that target, because the v flag needs Chrome 112, Firefox 116, and Safari 17. Keep it while the target predates those versions.
            - Baseline build warning: "Some chunks are larger than 500 kB after minification". This is expected for a single-file bundle.

            Validation
            - `pnpm test` builds, then runs Playwright in Chromium against tests/fixture.html with real pointer interaction. The workflow installs Chromium before this step. If @playwright/test changes version, run `pnpm exec playwright install --with-deps chromium` before testing.
            - The prepare script runs `skills experimental_sync` on every install. Its "Skipped ... SKILL.md" lines and the gitignored .agents/ directory it writes are expected noise.
            - TypeScript is capped by the @kitschpatrol/typescript-config peer range and by svelte-check's typescript peer range. Defer compiler majors until both allow them.

            Release recommendation
            - If dist/main.js changes in any way beyond identifier renames or Svelte hash churn, recommend at least a patch: CDN users receive the new bundle immediately. If only tooling changed and dist/main.js is unchanged, say no release is needed.
